project:
  name: immutables
  languages:
    java:
      groupId: org.immutables

signing:
  active: ALWAYS
  pgp:
    armored: true

release:
  github:
    tagName: '{{projectVersion}}'
    releaseName: '{{projectVersion}}'
    overwrite: true
    changelog:
      formatted: ALWAYS
      preset: conventional-commits

deploy:
  maven:
    mavenCentral:
      release-deploy:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        applyMavenCentralRules: true
        skipPublicationCheck: true
        stagingRepositories:
          - target/staging-deploy
